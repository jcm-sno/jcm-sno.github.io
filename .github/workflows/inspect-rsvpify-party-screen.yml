name: Inspect RSVPify Party Screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rsvpify-party-screen.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect mock household response screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-party
          cd /tmp/rsvpify-party
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 2, isMobile: true, hasTouch: true });
          const page = await context.newPage();
          await page.goto('https://jcm-sno.rsvpify.com', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(7000);
          const accept = page.getByRole('button', { name: /accept all/i });
          if (await accept.count()) { await accept.click().catch(() => {}); await page.waitForTimeout(1000); }

          await page.locator('input[placeholder="First Name"]').fill('Michael');
          await page.locator('input[placeholder="Last Name"]').fill('Morrison');
          const lookupEmail = page.locator('input[placeholder="Email Address"]');
          if (await lookupEmail.count()) await lookupEmail.fill('michael.morrison.mock@example.com');
          await page.getByRole('button', { name: /continue/i }).click();
          await page.waitForTimeout(5000);

          const report = await page.evaluate(() => {
            const all=[...document.querySelectorAll('*')];
            const leafByText=(text)=>all.find(el=>el.children.length===0 && el.textContent?.trim()===text);
            const containsText=(text)=>all.filter(el=>el.textContent?.trim()===text).slice(0,10);
            const email=[...document.querySelectorAll('input')].find(el=>(el.value||'').includes('@')) || document.querySelector('input[type="email"]');
            const michael=leafByText('Michael Morrison') || containsText('Michael Morrison')[0];
            const evelyn=leafByText('Evelyn Morrison') || containsText('Evelyn Morrison')[0];
            const zachary=leafByText('Zachary Morrison') || containsText('Zachary Morrison')[0];
            const summary=(el)=>{ if(!(el instanceof HTMLElement))return null; const s=getComputedStyle(el),r=el.getBoundingClientRect(); return {tag:el.tagName.toLowerCase(),id:el.id,className:el.className,text:el.children.length===0?el.textContent?.trim().slice(0,120):undefined,value:el instanceof HTMLInputElement?el.value:undefined,placeholder:el instanceof HTMLInputElement?el.placeholder:undefined,rect:{x:+r.x.toFixed(1),y:+r.y.toFixed(1),width:+r.width.toFixed(1),height:+r.height.toFixed(1)},display:s.display,position:s.position,order:s.order,flexDirection:s.flexDirection,gridTemplateColumns:s.gridTemplateColumns,gap:s.gap};};
            const chain=(el,n=14)=>{const out=[];let cur=el;while(cur&&out.length<n){out.push(summary(cur));cur=cur.parentElement;}return out;};
            const common=(a,b)=>{if(!a||!b)return null;const aa=[];let c=a;while(c){aa.push(c);c=c.parentElement;}c=b;while(c&&!aa.includes(c))c=c.parentElement;return c;};
            const em=common(email,michael), party=common(michael,zachary);
            return {title:document.title,bodyText:document.body.innerText.slice(0,4000),email:summary(email),michael:summary(michael),evelyn:summary(evelyn),zachary:summary(zachary),emailChain:chain(email),michaelChain:chain(michael),emailMichaelCommon:summary(em),emailMichaelCommonOuterHTML:em?.outerHTML?.slice(0,35000)??null,partyCommon:summary(party),partyCommonOuterHTML:party?.outerHTML?.slice(0,60000)??null};
          });
          console.log(JSON.stringify(report,null,2));
          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-party-screen.png', fullPage: true, animations:'disabled' });
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsvpify-party-screen
          path: rsvpify-party-screen.png
          retention-days: 1
