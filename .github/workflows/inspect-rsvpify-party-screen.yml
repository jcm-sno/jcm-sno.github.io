name: Inspect RSVPify Party Screen

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rsvpify-party-screen.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect mock household response screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-party
          cd /tmp/rsvpify-party
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > inspect.mjs <<'EOF'
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          await page.goto('https://jcm-sno.rsvpify.com', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(8000);

          const reject = page.getByRole('button', { name: /reject all/i });
          if (await reject.count()) {
            await reject.click().catch(() => {});
            await page.waitForTimeout(500);
          }

          await page.locator('input[placeholder="First Name"]').fill('Michael');
          await page.locator('input[placeholder="Last Name"]').fill('Morrison');
          const lookupEmail = page.locator('input[placeholder="Email Address"]');
          if (await lookupEmail.count()) await lookupEmail.fill('michael.morrison.mock@example.com');
          await page.getByRole('button', { name: /continue/i }).click();
          await page.waitForTimeout(3500);

          const report = await page.evaluate(() => {
            const all = [...document.querySelectorAll('*')];
            const byText = (text) => all.find((el) => el.children.length === 0 && el.textContent?.trim() === text);
            const email = document.querySelector('input[type="email"]') || [...document.querySelectorAll('input')].find((el) => (el.value || '').includes('@'));
            const michael = byText('Michael Morrison');
            const evelyn = byText('Evelyn Morrison');
            const zachary = byText('Zachary Morrison');

            const summary = (el) => {
              if (!(el instanceof HTMLElement)) return null;
              const s = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return {
                tag: el.tagName.toLowerCase(),
                id: el.id,
                className: el.className,
                text: el.children.length === 0 ? el.textContent?.trim().slice(0,120) : undefined,
                value: el instanceof HTMLInputElement ? el.value : undefined,
                placeholder: el instanceof HTMLInputElement ? el.placeholder : undefined,
                rect: { x:+r.x.toFixed(1), y:+r.y.toFixed(1), width:+r.width.toFixed(1), height:+r.height.toFixed(1) },
                display: s.display,
                position: s.position,
                order: s.order,
                flexDirection: s.flexDirection,
                gridTemplateColumns: s.gridTemplateColumns,
                gap: s.gap,
              };
            };

            const chain = (el, n=10) => {
              const out=[];
              let cur=el;
              while(cur && out.length<n){ out.push(summary(cur)); cur=cur.parentElement; }
              return out;
            };

            const commonAncestor = (a,b) => {
              if (!a || !b) return null;
              const aa=[]; let cur=a; while(cur){aa.push(cur);cur=cur.parentElement;}
              cur=b; while(cur && !aa.includes(cur)) cur=cur.parentElement;
              return cur;
            };

            const emailMichaelCommon = commonAncestor(email,michael);
            const partyCommon = commonAncestor(michael, zachary);
            return {
              url: location.href,
              email: summary(email),
              michael: summary(michael),
              evelyn: summary(evelyn),
              zachary: summary(zachary),
              emailChain: chain(email,12),
              michaelChain: chain(michael,12),
              emailMichaelCommon: summary(emailMichaelCommon),
              emailMichaelCommonOuterHTML: emailMichaelCommon?.outerHTML?.slice(0,25000) ?? null,
              partyCommon: summary(partyCommon),
              partyCommonOuterHTML: partyCommon?.outerHTML?.slice(0,50000) ?? null,
            };
          });

          console.log(JSON.stringify(report, null, 2));
          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-party-screen.png', fullPage: true, animations: 'disabled' });
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsvpify-party-screen
          path: rsvpify-party-screen.png
          retention-days: 1
