name: Finalize and verify About page

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-finalize-about-page.yml

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Rebuild banner at full display resolution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --quiet pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageFilter

          path = Path("public/about-banner.webp")
          source = Image.open(path).convert("RGB")
          resized = source.resize((2048, 1365), Image.Resampling.LANCZOS)
          sharpened = resized.filter(
              ImageFilter.UnsharpMask(radius=1.15, percent=95, threshold=3)
          )
          sharpened.save(path, "WEBP", quality=90, method=6)

          check = Image.open(path)
          assert check.size == (2048, 1365), check.size
          assert path.stat().st_size >= 75000, path.stat().st_size
          print(f"Banner: {check.size[0]}x{check.size[1]}, {path.stat().st_size} bytes")
          PY

      - name: Validate requested source changes
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'May 15, 2027 · Port Orange, Florida' app/page.tsx
          grep -q 'width="2048"' app/page.tsx
          grep -q 'height="1365"' app/page.tsx
          grep -q 'Static street map' app/page.tsx
          ! grep -q 'A little bit of our story' app/page.tsx
          ! grep -q 'Welcome to our corner' app/page.tsx
          ! grep -qi 'openstreetmap' app/page.tsx
          grep -q 'object-fit: contain' app/review-overrides.css
          grep -q 'text-align: center' app/review-overrides.css
          grep -q 'long-distance-seafood' app/review-overrides.css
          grep -q 'align-items: stretch' app/review-overrides.css

      - name: Install, lint, and build Pages site
        shell: bash
        env:
          NEXT_PUBLIC_ZOLA_REGISTRY_URL: ${{ vars.ZOLA_REGISTRY_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm run build:pages

      - name: Commit banner and remove temporary machinery
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp
          rm -f .github/workflows/tmp-inspect-assets.yml
          rm -f .github/workflows/tmp-inspect-rsvpify-email.yml
          rm -f .github/workflows/tmp-finalize-about-page.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish refined About page and high-resolution banner"
          git push origin HEAD:main

          final_sha="$(git rev-parse HEAD)"
          expected_banner_sha="$(sha256sum public/about-banner.webp | awk '{print $1}')"
          echo "final_sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "expected_banner_sha=$expected_banner_sha" >> "$GITHUB_OUTPUT"
          echo "Final commit: $final_sha"
          echo "Banner SHA-256: $expected_banner_sha"

      - name: Wait for GitHub Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          set -euo pipefail
          completed="false"
          for attempt in $(seq 1 90); do
            json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?workflow_id=341749998&head_sha=${FINAL_SHA}&per_page=1")"
            count="$(jq -r '.total_count' <<< "$json")"
            status="$(jq -r '.workflow_runs[0].status // empty' <<< "$json")"
            conclusion="$(jq -r '.workflow_runs[0].conclusion // empty' <<< "$json")"
            echo "Attempt ${attempt}: count=${count}, status=${status:-pending}, conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              completed="true"
              break
            fi
            sleep 10
          done
          test "$completed" = "true"

      - name: Verify deployed HTML and banner bytes
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
          EXPECTED_BANNER_SHA: ${{ steps.commit.outputs.expected_banner_sha }}
        run: |
          set -euo pipefail
          mkdir -p qa
          site="https://jcm-sno.github.io/?verify=${FINAL_SHA}"
          banner="https://jcm-sno.github.io/about-banner.webp?verify=${FINAL_SHA}"

          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$site" -o qa/index.html
          grep -q 'May 15, 2027' qa/index.html
          grep -q 'Port Orange, Florida' qa/index.html
          grep -q 'James' qa/index.html
          grep -q 'Samantha' qa/index.html
          grep -q 'Archive' qa/index.html
          ! grep -q 'A little bit of our story' qa/index.html
          ! grep -q 'Welcome to our corner' qa/index.html
          ! grep -qi 'openstreetmap' qa/index.html

          curl --fail --silent --show-error --retry 12 --retry-delay 5 "$banner" -o qa/live-about-banner.webp
          actual_banner_sha="$(sha256sum qa/live-about-banner.webp | awk '{print $1}')"
          test "$actual_banner_sha" = "$EXPECTED_BANNER_SHA"

          python <<'PY'
          from pathlib import Path
          from PIL import Image
          path = Path("qa/live-about-banner.webp")
          image = Image.open(path)
          assert image.size == (2048, 1365), image.size
          assert path.stat().st_size >= 75000, path.stat().st_size
          print(f"Live banner verified: {image.size[0]}x{image.size[1]}, {path.stat().st_size} bytes")
          PY

      - name: Inspect deployed desktop and mobile layouts
        shell: bash
        env:
          FINAL_SHA: ${{ steps.commit.outputs.final_sha }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/layout-check qa
          cd /tmp/layout-check
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"

          cat > inspect.mjs <<'EOF'
          import fs from "node:fs";
          import { chromium } from "playwright-core";

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ["--no-sandbox", "--disable-dev-shm-usage"],
          });

          const site = `https://jcm-sno.github.io/?layout=${process.env.FINAL_SHA}`;
          const results = {};

          async function inspect(name, viewport, isMobile = false) {
            const context = await browser.newContext({ viewport, isMobile, hasTouch: isMobile });
            const page = await context.newPage();
            await page.goto(site, { waitUntil: "networkidle", timeout: 90000 });
            await page.waitForSelector(".hero-photo", { state: "visible" });
            await page.locator(".hero-photo").evaluate((img) => img.decode?.());

            const report = await page.evaluate(() => {
              const rect = (el) => {
                const r = el.getBoundingClientRect();
                return { x: r.x, y: r.y, width: r.width, height: r.height, right: r.right, bottom: r.bottom };
              };
              const overlapRatio = (a, b) => {
                const x = Math.max(0, Math.min(a.right, b.right) - Math.max(a.x, b.x));
                const y = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.y, b.y));
                return (x * y) / Math.max(1, a.width * a.height);
              };

              const album = document.querySelector(".album-page");
              const nav = document.querySelector(".site-nav");
              const wordmark = document.querySelector(".wordmark");
              const about = document.querySelector('.site-nav nav a[href="/"]');
              const rsvp = document.querySelector(".nav-rsvp");
              const hero = document.querySelector(".hero-banner");
              const heroCopy = document.querySelector(".hero-copy");
              const eyebrow = document.querySelector(".hero-copy .eyebrow");
              const heroImage = document.querySelector(".hero-photo");
              const seafood = document.querySelector(".long-distance-seafood");
              const distanceStory = document.querySelector(".long-distance-story");
              const harbor = document.querySelector(".long-distance-harbor");

              const albumRect = rect(album);
              const navRect = rect(nav);
              const wordmarkRect = rect(wordmark);
              const aboutRect = rect(about);
              const rsvpRect = rect(rsvp);
              const heroRect = rect(hero);
              const copyRect = rect(heroCopy);
              const eyebrowRect = rect(eyebrow);
              const seafoodRect = rect(seafood);
              const distanceRect = rect(distanceStory);
              const harborRect = rect(harbor);

              const stories = [...document.querySelectorAll(".story-card")].map((story) => {
                const storyRect = rect(story);
                const clusterRect = rect(story.parentElement);
                return {
                  textAlign: getComputedStyle(story).textAlign,
                  normalizedCenterOffset:
                    Math.abs((storyRect.x + storyRect.width / 2) - (clusterRect.x + clusterRect.width / 2)) /
                    clusterRect.width,
                };
              });

              return {
                viewport: { width: innerWidth, height: innerHeight },
                albumTop: albumRect.y,
                navTop: navRect.y,
                wordmarkBeforeAbout: wordmarkRect.x < aboutRect.x,
                aboutSingleLine: about.scrollHeight <= about.clientHeight + 2,
                rsvpFillsHeader: Math.abs(rsvpRect.height - navRect.height) <= 2,
                rsvpTouchesHero: Math.abs(rsvpRect.bottom - heroRect.y) <= 2,
                eyebrowTextAlign: getComputedStyle(eyebrow).textAlign,
                eyebrowCenteredOverNames:
                  Math.abs((eyebrowRect.x + eyebrowRect.width / 2) - (copyRect.x + copyRect.width / 2)) <= 2,
                imageNaturalSize: { width: heroImage.naturalWidth, height: heroImage.naturalHeight },
                mapLinks: document.querySelectorAll(".field-day-map a").length,
                storyCards: stories,
                seafoodStoryOverlap: overlapRatio(seafoodRect, distanceRect),
                seafoodHarborOverlap: overlapRatio(seafoodRect, harborRect),
                horizontalOverflow: document.documentElement.scrollWidth - innerWidth,
              };
            });

            results[name] = report;
            await page.screenshot({
              path: `${process.env.GITHUB_WORKSPACE}/qa/${name}.png`,
              fullPage: true,
              animations: "disabled",
            });
            await context.close();
          }

          await inspect("desktop-1440", { width: 1440, height: 1000 });
          await inspect("mobile-390", { width: 390, height: 844 }, true);

          const desktop = results["desktop-1440"];
          const mobile = results["mobile-390"];

          const checks = [
            [desktop.albumTop === 0, `desktop album top=${desktop.albumTop}`],
            [desktop.navTop === 0, `desktop nav top=${desktop.navTop}`],
            [desktop.wordmarkBeforeAbout, "wordmark must be left of About Us"],
            [desktop.aboutSingleLine, "About Us must remain one line"],
            [desktop.rsvpFillsHeader, "RSVP block must fill header height"],
            [desktop.rsvpTouchesHero, "RSVP block must touch hero"],
            [desktop.eyebrowTextAlign === "center", `eyebrow text-align=${desktop.eyebrowTextAlign}`],
            [desktop.eyebrowCenteredOverNames, "date/location must be centered over names"],
            [desktop.imageNaturalSize.width === 2048 && desktop.imageNaturalSize.height === 1365,
              `image=${desktop.imageNaturalSize.width}x${desktop.imageNaturalSize.height}`],
            [desktop.mapLinks === 0, `static map contains ${desktop.mapLinks} links`],
            [desktop.storyCards.every((card) => card.textAlign === "center"), "all desktop story cards must center text"],
            [desktop.storyCards.every((card) => card.normalizedCenterOffset < 0.19), "story cards must sit near cluster centers"],
            [desktop.seafoodStoryOverlap < 0.08, `seafood/story overlap=${desktop.seafoodStoryOverlap}`],
            [desktop.seafoodHarborOverlap < 0.08, `seafood/harbor overlap=${desktop.seafoodHarborOverlap}`],
            [desktop.horizontalOverflow <= 1, `desktop overflow=${desktop.horizontalOverflow}`],
            [mobile.horizontalOverflow <= 1, `mobile overflow=${mobile.horizontalOverflow}`],
            [mobile.mapLinks === 0, `mobile static map contains ${mobile.mapLinks} links`],
          ];

          const failures = checks.filter(([ok]) => !ok).map(([, message]) => message);
          fs.writeFileSync(
            `${process.env.GITHUB_WORKSPACE}/qa/layout-report.json`,
            JSON.stringify({ results, failures }, null, 2),
          );
          console.log(JSON.stringify({ results, failures }, null, 2));
          await browser.close();
          if (failures.length) process.exit(1);
          EOF

          CHROME_PATH="$CHROME_PATH" FINAL_SHA="$FINAL_SHA" node inspect.mjs

      - name: Upload deployment QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-page-deployment-qa
          path: qa
          retention-days: 7
