name: Cancel stale Pages deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cancel-stale-pages.yml"

permissions:
  contents: read
  pages: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/da69560779cb390bdc886f620eb4afa00d066e66/cancel"
