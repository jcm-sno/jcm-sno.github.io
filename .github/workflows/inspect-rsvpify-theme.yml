name: Inspect RSVPify Theme

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rsvpify-theme.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install lightweight browser driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-inspect
          cd /tmp/rsvpify-inspect
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
          echo "NODE_PATH=/tmp/rsvpify-inspect/node_modules" >> "$GITHUB_ENV"

      - name: Test candidate CSS on live forms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rsvpify-inspection
          cat > /tmp/rsvpify-inspect/inspect.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const css = fs.readFileSync('docs/rsvpify-form-theme.css', 'utf8');
          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });

          const targets = [
            { id: 'standalone-mobile', url: 'https://jcm-sno.rsvpify.com' },
            { id: 'embed-mobile', url: 'https://jcm-sno.github.io/rsvp/' },
          ];

          async function findFormFrame(page) {
            const deadline = Date.now() + 60000;
            while (Date.now() < deadline) {
              for (const frame of page.frames()) {
                const count = await frame.locator('input[placeholder="First Name"]').count().catch(() => 0);
                if (count) return frame;
              }
              await page.waitForTimeout(500);
            }
            return null;
          }

          function roundedRect(rect) {
            if (!rect) return null;
            return Object.fromEntries(
              Object.entries(rect.toJSON()).map(([key, value]) => [key, Number(value.toFixed(2))]),
            );
          }

          for (const target of targets) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 2,
              isMobile: true,
              hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
            });
            const page = await context.newPage();
            const output = { target, error: null, before: null, after: null };

            try {
              await page.goto(target.url, { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForTimeout(8000);
              const frame = await findFormFrame(page);
              if (!frame) throw new Error('First Name input not found in any frame');

              const measure = async () => {
                const first = frame.locator('input[placeholder="First Name"]').first();
                const last = frame.locator('input[placeholder="Last Name"]').first();
                const email = frame.locator('input[placeholder="Email Address"]').first();
                const row = frame.locator('div.flex.w-full.space-x-2').filter({ has: first }).first();
                const card = frame.locator('div.relative.w-full.rounded-md.px-4.py-8.themed-element-form-background').filter({ has: first }).first();
                const outer = frame.locator('div.themed-element-form-background.mt-20.mb-24.mx-4').first();
                const continueButton = frame.getByRole('button', { name: /continue/i }).first();

                const computed = async (locator) => {
                  if (!(await locator.count())) return null;
                  return locator.evaluate((el) => {
                    const style = getComputedStyle(el);
                    const rect = el.getBoundingClientRect();
                    return {
                      tag: el.tagName.toLowerCase(),
                      className: el.className,
                      rect: {
                        x: Number(rect.x.toFixed(2)),
                        y: Number(rect.y.toFixed(2)),
                        width: Number(rect.width.toFixed(2)),
                        height: Number(rect.height.toFixed(2)),
                      },
                      display: style.display,
                      gridTemplateColumns: style.gridTemplateColumns,
                      gap: style.gap,
                      margin: style.margin,
                      padding: style.padding,
                      fontFamily: style.fontFamily,
                      fontSize: style.fontSize,
                      lineHeight: style.lineHeight,
                      color: style.color,
                      backgroundColor: style.backgroundColor,
                      border: style.border,
                      borderRadius: style.borderRadius,
                      boxShadow: style.boxShadow,
                      overflow: style.overflow,
                    };
                  });
                };

                return {
                  frameUrl: frame.url(),
                  first: await computed(first),
                  last: await computed(last),
                  email: await computed(email),
                  row: await computed(row),
                  card: await computed(card),
                  outer: await computed(outer),
                  continueButton: await computed(continueButton),
                  overlap: await Promise.all([first.boundingBox(), last.boundingBox()]).then(([a, b]) => {
                    if (!a || !b) return null;
                    return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
                  }),
                  frames: page.frames().map((item) => item.url()),
                };
              };

              output.before = await measure();
              await page.screenshot({
                path: `rsvpify-inspection/${target.id}-before.png`,
                fullPage: true,
                animations: 'disabled',
              });

              await frame.addStyleTag({ content: css });
              await page.waitForTimeout(1000);
              output.after = await measure();
              await page.screenshot({
                path: `rsvpify-inspection/${target.id}-after.png`,
                fullPage: true,
                animations: 'disabled',
              });
            } catch (error) {
              output.error = error instanceof Error ? error.stack : String(error);
            }

            fs.writeFileSync(
              `rsvpify-inspection/${target.id}-report.json`,
              JSON.stringify(output, null, 2),
            );
            console.log(`\n===== ${target.id} =====\n${JSON.stringify(output, null, 2)}`);
            await context.close();
          }

          await browser.close();
          EOF
          node /tmp/rsvpify-inspect/inspect.mjs

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsvpify-theme-inspection
          path: rsvpify-inspection
          retention-days: 1
