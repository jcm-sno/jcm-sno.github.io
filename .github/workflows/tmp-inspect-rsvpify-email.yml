name: Temporary RSVPify Email Inspection

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-inspect-rsvpify-email.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect live RSVPify flow
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-inspect
          cd /tmp/rsvpify-inspect
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > inspect.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const browser = await chromium.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            locale: 'en-US',
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          const consoleLines = [];
          page.on('console', (msg) => consoleLines.push(`console:${msg.type()}:${msg.text()}`));
          page.on('pageerror', (err) => consoleLines.push(`pageerror:${err.message}`));

          await page.goto('https://jcm-sno.rsvpify.com/', {
            waitUntil: 'domcontentloaded',
            timeout: 90000,
          });
          await page.waitForTimeout(5000);

          // Cloudflare's consent service returns 403 in headless CI. Remove only
          // that blocking overlay; this does not alter RSVPify's registration DOM.
          await page.evaluate(() => {
            const nodes = [...document.querySelectorAll('body *')];
            const textNode = nodes.find((el) => el.children.length === 0 && el.textContent?.trim() === 'We value your privacy');
            if (textNode) {
              let current = textNode;
              let fixed = null;
              while (current && current !== document.body) {
                const style = getComputedStyle(current);
                if (style.position === 'fixed') fixed = current;
                current = current.parentElement;
              }
              (fixed || textNode.parentElement)?.remove();
            }
            document.body.style.overflow = 'auto';
          });

          await page.locator('input[placeholder="First Name"]').waitFor({ state: 'visible', timeout: 30000 });
          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-lookup-before.png', fullPage: true, animations: 'disabled' });

          const first = page.locator('input[placeholder="First Name"]').first();
          const last = page.locator('input[placeholder="Last Name"]').first();
          await first.fill('Michael');
          await last.fill('Morrison');
          const lookupEmail = page.locator('input[placeholder="Email Address"]').first();
          if (await lookupEmail.count()) {
            await lookupEmail.fill('michael.morrison.mock@example.com');
          }

          const continueButton = page.getByRole('button', { name: /continue/i }).first();
          const before = {
            disabled: await continueButton.isDisabled().catch(() => null),
            bodyText: (await page.locator('body').innerText()).slice(0,3000),
          };
          await continueButton.evaluate((el) => el.click());

          let reachedParty = false;
          for (let i = 0; i < 40; i++) {
            if ((await page.getByText('Michael Morrison', { exact: true }).count()) > 0) {
              reachedParty = true;
              break;
            }
            await page.waitForTimeout(500);
          }

          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-after-continue.png', fullPage: true, animations: 'disabled' });

          const report = await page.evaluate(() => {
            const bodyText = document.body.innerText.slice(0, 10000);
            const inputs = [...document.querySelectorAll('input')].map((el) => ({
              type: el.type,
              value: el.value,
              placeholder: el.placeholder,
              className: el.className,
              outerHTML: el.outerHTML.slice(0,4000),
              rect: (() => { const r = el.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; })(),
            }));
            const buttons = [...document.querySelectorAll('button')].map((el) => ({
              text: el.innerText.trim(),
              disabled: el.disabled,
              className: el.className,
              outerHTML: el.outerHTML.slice(0,4000),
            }));
            const exactTextElements = ['Michael Morrison','Evelyn Morrison','Zachary Morrison','Edit Name','Attending',"Can't Make It"].flatMap((text) =>
              [...document.querySelectorAll('*')]
                .filter((el) => el.children.length === 0 && el.textContent?.trim() === text)
                .map((el) => ({ text, tag: el.tagName, className: el.className, outerHTML: el.outerHTML.slice(0,6000) }))
            );
            const prefilledEmail = [...document.querySelectorAll('input')].find((el) => el.value?.includes('@'));
            const emailChain = [];
            let current = prefilledEmail;
            while (current && emailChain.length < 18) {
              emailChain.push({ tag: current.tagName, className: current.className, outerHTML: current.outerHTML.slice(0,30000) });
              current = current.parentElement;
            }
            return { bodyText, inputs, buttons, exactTextElements, emailChain, html: document.documentElement.outerHTML.slice(0,350000) };
          });

          fs.writeFileSync(process.env.GITHUB_WORKSPACE + '/rsvpify-report.json', JSON.stringify({ reachedParty, before, report, consoleLines }, null, 2));
          console.log(JSON.stringify({ reachedParty, before, bodyText: report.bodyText, inputs: report.inputs, buttons: report.buttons, exactTextElements: report.exactTextElements, emailChain: report.emailChain, consoleLines }, null, 2));
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node inspect.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tmp-rsvpify-email-inspection
          path: |
            rsvpify-lookup-before.png
            rsvpify-after-continue.png
            rsvpify-report.json
          retention-days: 1
