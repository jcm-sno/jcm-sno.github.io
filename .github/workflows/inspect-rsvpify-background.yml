name: Inspect RSVPify Background

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rsvpify-background.yml
      - docs/rsvpify-form-theme.css

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect background layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-bg
          cd /tmp/rsvpify-bg
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > inspect.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const css = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/docs/rsvpify-form-theme.css', 'utf8');
          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          await page.goto('https://jcm-sno.rsvpify.com', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(8000);
          const reject = page.getByRole('button', { name: /reject all/i });
          if (await reject.count()) {
            await reject.click().catch(() => {});
            await page.waitForTimeout(500);
          }
          await page.addStyleTag({ content: css });
          await page.waitForTimeout(500);

          const first = page.locator('input[placeholder="First Name"]').first();
          const last = page.locator('input[placeholder="Last Name"]').first();
          const email = page.locator('input[placeholder="Email Address"]').first();
          const row = page.locator('div.flex.w-full.space-x-2').filter({ has: first }).first();
          const card = page.locator('div.relative.w-full.rounded-md.px-4.py-8.themed-element-form-background').filter({ has: first }).first();
          const outer = page.locator('div.themed-element-form-background.mt-20.mb-24.mx-4').first();
          const button = page.getByRole('button', { name: /continue/i }).first();

          async function summary(locator) {
            return locator.evaluate((el) => {
              const s = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return {
                rect: { x: +r.x.toFixed(1), y: +r.y.toFixed(1), width: +r.width.toFixed(1), height: +r.height.toFixed(1) },
                display: s.display,
                gridTemplateColumns: s.gridTemplateColumns,
                gap: s.gap,
                margin: s.margin,
                padding: s.padding,
                fontFamily: s.fontFamily,
                fontSize: s.fontSize,
                color: s.color,
                backgroundColor: s.backgroundColor,
                border: s.border,
                borderRadius: s.borderRadius,
                boxShadow: s.boxShadow,
              };
            });
          }

          const report = {
            first: await summary(first),
            last: await summary(last),
            email: await summary(email),
            row: await summary(row),
            card: await summary(card),
            outer: await summary(outer),
            button: await summary(button),
            bodyBackground: await page.locator('body').evaluate((el) => getComputedStyle(el).backgroundColor),
            appBackground: await page.locator('#app').evaluate((el) => getComputedStyle(el).backgroundColor),
          };
          console.log(JSON.stringify(report, null, 2));
          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-bg-after.png', fullPage: true, animations: 'disabled' });
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsvpify-background-inspection
          path: rsvpify-bg-after.png
          retention-days: 1
