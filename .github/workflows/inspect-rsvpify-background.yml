name: Inspect RSVPify Background

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-rsvpify-background.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Inspect background layers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rsvpify-bg
          cd /tmp/rsvpify-bg
          npm init -y >/dev/null
          npm install --silent playwright-core@1.55.0
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          cat > inspect.mjs <<'EOF'
          import fs from 'node:fs';
          import { chromium } from 'playwright-core';

          const css = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/docs/rsvpify-form-theme.css', 'utf8');
          const browser = await chromium.launch({ executablePath: process.env.CHROME_PATH, headless: true, args: ['--no-sandbox'] });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 2,
            isMobile: true,
            hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          await page.goto('https://jcm-sno.rsvpify.com', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForTimeout(8000);
          const reject = page.getByRole('button', { name: /reject all/i });
          if (await reject.count()) {
            await reject.click().catch(() => {});
            await page.waitForTimeout(500);
          }
          await page.addStyleTag({ content: css });
          await page.waitForTimeout(500);

          const report = await page.evaluate(() => {
            function summary(el) {
              if (!(el instanceof HTMLElement)) return null;
              const s = getComputedStyle(el);
              const r = el.getBoundingClientRect();
              return {
                tag: el.tagName.toLowerCase(),
                id: el.id,
                className: el.className,
                rect: { x: +r.x.toFixed(1), y: +r.y.toFixed(1), width: +r.width.toFixed(1), height: +r.height.toFixed(1) },
                position: s.position,
                display: s.display,
                overflow: s.overflow,
                color: s.color,
                backgroundColor: s.backgroundColor,
                backgroundImage: s.backgroundImage,
                opacity: s.opacity,
                zIndex: s.zIndex,
              };
            }
            const points = [[1,1],[10,320],[10,560],[10,700],[195,700],[380,700]].map(([x,y]) => {
              const element = document.elementFromPoint(x,y);
              const chain = [];
              let current = element;
              while (current && chain.length < 12) {
                chain.push(summary(current));
                current = current.parentElement;
              }
              return { x, y, chain };
            });
            const blackish = [...document.querySelectorAll('body *')].map(summary).filter((item) => {
              if (!item || item.rect.width < 20 || item.rect.height < 20) return false;
              const m = item.backgroundColor.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)/);
              if (!m) return false;
              const [,r,g,b,a='1'] = m;
              return +a > 0.05 && +r < 55 && +g < 55 && +b < 55;
            }).slice(0,100);
            const input = document.querySelector('input[placeholder="First Name"]');
            const inputChain = [];
            let current = input;
            while (current) {
              inputChain.push(summary(current));
              current = current.parentElement;
            }
            return {
              html: summary(document.documentElement),
              body: summary(document.body),
              bodyChildren: [...document.body.children].map(summary),
              inputChain,
              points,
              blackish,
            };
          });
          console.log(JSON.stringify(report, null, 2));
          await page.screenshot({ path: process.env.GITHUB_WORKSPACE + '/rsvpify-bg-after.png', fullPage: true, animations: 'disabled' });
          await browser.close();
          EOF
          CHROME_PATH="$CHROME_PATH" node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rsvpify-background-inspection
          path: rsvpify-bg-after.png
          retention-days: 1
